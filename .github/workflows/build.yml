name: build-desktop

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # tag 触发时创建 Release 并上传资产

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pywebview openpyxl pyinstaller
      - name: Run reliability tests
        run: python -m unittest discover -s tests -v
      - name: Build with PyInstaller (onedir)
        # separator: ';' on Windows, ':' on macOS
        run: pyinstaller --noconfirm --windowed --clean --name BKTC_Ledger --add-data "ui${{ runner.os == 'Windows' && ';' || ':' }}ui" --collect-all webview --hidden-import "webview.platforms.edgechromium" app.py
      - name: Set macOS bundle version
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_VERSION="$(python -c 'import app; print(app.__version__)')"
          plutil -replace CFBundleShortVersionString -string "$APP_VERSION" dist/BKTC_Ledger.app/Contents/Info.plist
          plutil -insert CFBundleVersion -string "$APP_VERSION" dist/BKTC_Ledger.app/Contents/Info.plist
          plutil -replace CFBundleDisplayName -string "上海康肯销售订单管理系统" dist/BKTC_Ledger.app/Contents/Info.plist
          plutil -replace CFBundleName -string "上海康肯销售订单管理系统" dist/BKTC_Ledger.app/Contents/Info.plist
          codesign --force --deep --sign - dist/BKTC_Ledger.app
      - name: Add portable starter database and workbook
        shell: bash
        run: python create_portable_starter.py "${{ runner.os == 'Windows' && 'dist/BKTC_Ledger/data' || 'dist/data' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: BKTC_Ledger-${{ runner.os }}
          path: dist/
          if-no-files-found: error
      # tag (v*) 触发时打包并发布到 Release；macOS tar.gz 保留 .app 可执行位
      - name: Package release asset (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "BKTC_Ledger-${RUNNER_OS}.zip" ./dist/*
          else
            tar -czf "BKTC_Ledger-${RUNNER_OS}.tar.gz" -C dist .
          fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: BKTC_Ledger-${{ runner.os }}.*
          generate_release_notes: true
