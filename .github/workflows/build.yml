name: build-desktop

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # tag 触发时创建 Release 并上传资产

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pywebview openpyxl pyinstaller
      - name: Build with PyInstaller (onedir)
        # separator: ';' on Windows, ':' on macOS
        run: pyinstaller --noconfirm --windowed --clean --name BKTC_Ledger --add-data "ui${{ runner.os == 'Windows' && ';' || ':' }}ui" --collect-all webview --hidden-import "webview.platforms.edgechromium" app.py
      - uses: actions/upload-artifact@v4
        with:
          name: BKTC_Ledger-${{ runner.os }}
          path: dist/
          if-no-files-found: error
      # tag (v*) 触发时打包并发布到 Release；tar.gz 保权限/符号链接（mac .app 可执行位）
      - name: Package release asset (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: tar -czf "BKTC_Ledger-${RUNNER_OS}.tar.gz" -C dist .
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: BKTC_Ledger-${{ runner.os }}.tar.gz
          generate_release_notes: true
